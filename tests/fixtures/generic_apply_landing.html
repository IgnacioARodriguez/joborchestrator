<!doctype html>
<html>
  <body>
    <main>
      <h1>Backend Engineer</h1>
      <button type="button" onclick="document.querySelector('#apply-form').hidden = false">I'm interested</button>
      <form id="apply-form" action="/apply" method="post" hidden>
        <label for="candidate_name">Full name *</label>
        <input id="candidate_name" name="candidate_name" type="text" required />

        <label for="candidate_email">Email *</label>
        <input id="candidate_email" name="candidate_email" type="email" required />

        <label for="resume_file">Resume *</label>
        <input id="resume_file" name="resume_file" type="file" required />

        <button type="submit">Submit application</button>
      </form>
    </main>
  </body>
</html>
