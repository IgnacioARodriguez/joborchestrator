<!doctype html>
<html>
  <body>
    <main>
      <a data-qa="btn-apply" href="/acme/backend/apply">Apply for this job</a>
      <form class="lever-application-form" action="/acme/backend/apply" method="post">
        <label for="name">Full name *</label>
        <input id="name" name="name" type="text" required />

        <label for="email">Email *</label>
        <input id="email" name="email" type="email" required />

        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" />

        <label for="linkedin">LinkedIn Profile *</label>
        <input id="linkedin" name="urls[LinkedIn]" type="url" required />

        <label for="portfolio">Portfolio</label>
        <input id="portfolio" name="urls[Portfolio]" type="url" />

        <label for="location">Preferred location *</label>
        <select id="location" name="cards[location]" required>
          <option value="">Select one</option>
          <option value="remote">Remote</option>
          <option value="madrid">Madrid</option>
        </select>

        <fieldset>
          <legend>Will you now or in the future require sponsorship?</legend>
          <label><input type="radio" name="cards[sponsorship]" value="yes" required /> Yes</label>
          <label><input type="radio" name="cards[sponsorship]" value="no" required /> No</label>
        </fieldset>

        <label for="cover_letter">Additional information</label>
        <textarea id="cover_letter" name="comments"></textarea>

        <label for="resume">Resume/CV *</label>
        <input id="resume" name="resume" type="file" required />

        <input type="hidden" name="csrf" value="ignored" />
        <button type="submit">Submit application</button>
      </form>
    </main>
  </body>
</html>
