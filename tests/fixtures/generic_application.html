<!doctype html>
<html>
  <body>
    <form action="/apply" method="post">
      <label for="candidate_name">Full name *</label>
      <input id="candidate_name" name="candidate_name" type="text" required />

      <label for="candidate_email">Email *</label>
      <input id="candidate_email" name="candidate_email" type="email" required />

      <label for="candidate_phone">Phone</label>
      <input id="candidate_phone" name="candidate_phone" type="tel" />

      <label for="candidate_linkedin">LinkedIn</label>
      <input id="candidate_linkedin" name="candidate_linkedin" type="url" />

      <label for="office">Preferred location</label>
      <select id="office" name="office">
        <option value="">Select one</option>
        <option value="remote">Remote</option>
        <option value="madrid">Madrid</option>
      </select>

      <label for="resume_file">Resume *</label>
      <input id="resume_file" name="resume_file" type="file" required />

      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
